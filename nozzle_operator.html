<!doctype html><html lang="fr"><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#193145;background:#eff4f8}.toolbar,.card{background:white;border:1px solid #c7d5df;border-radius:8px;padding:12px;margin:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0}canvas{display:block;width:100%;height:auto;touch-action:none;border:1px solid #bdccd8;background:#f8fbfd}button,select{padding:7px;margin:3px}button{cursor:pointer}p{margin:7px 0;line-height:1.4}.small{font-size:12px;color:#526779}.status{font-weight:bold}label{margin-right:12px}h3{font-size:16px;margin:0 0 8px}@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style><body><div class="toolbar"><h3>BYTE NDT — NOZZLE · SCAN MANUEL / MANUAL SCAN</h3>
<p id="help"></p><div><button id="demo">Créneaux ▶ / Raster ▶</button><button id="pause">Pause</button><button id="minus">−1°</button><button id="plus">+1°</button><button id="opposite">Retourner / Reverse 180°</button><button id="reset">Réinitialiser / Reset</button><button id="record">Enregistrer point / Record point</button><button id="download">Exporter / Export JSON</button></div>
<label><input id="instructor" type="checkbox">Instructeur / Instructor</label><label>Gain <input id="gain" type="range" min="1" max="8" step="0.5" value="3"></label><p id="state" class="status"></p><p id="notice" class="small"></p></div>
<div class="grid"><div class="card"><h3 id="topTitle"></h3><canvas id="top" width="720" height="430"></canvas><p class="small" id="topHelp"></p></div><div class="card"><h3 id="sectionTitle"></h3><label>Vue / View <select id="rayView"><option value="section">Coupe / Section</option><option value="3d">Nozzle 3D + rayons / rays</option></select></label><button id="cameraReset">Vue initiale / Reset view</button><canvas id="section" width="720" height="430"></canvas><p id="raysInfo" class="small"></p></div><div class="card"><h3 id="ascanTitle"></h3><div><label>Porte / Gate <select id="gate"><option>A</option><option>B</option><option>C</option></select></label><label>Début / Start µs <input id="gateStart" type="number" min="0" value="0" step="1" style="width:70px"></label><label>Fin / End µs <input id="gateEnd" type="number" min="0" value="80" step="1" style="width:70px"></label><label>Seuil relatif / Relative threshold <input id="gateThreshold" type="number" min="0" max="1" step="0.01" value="0.01" style="width:70px"></label></div><canvas id="ascan" width="720" height="300"></canvas><p id="maxInfo" class="small"></p><p id="sizingInfo" class="small"></p></div><div class="card"><h3 id="fieldTitle"></h3><canvas id="field" width="720" height="300"></canvas><p id="truth" class="small"></p></div></div>
<script>
const C=__CONFIG__, fr=C.language==='FR',T=(a,b)=>fr?a:b;
const R=C.geometry.main_OD_mm/2, Ri=R-C.geometry.main_thickness_mm,L=C.geometry.main_length_mm;
const rad=v=>v*Math.PI/180,deg=v=>v*180/Math.PI,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const add=(a,b)=>a.map((v,i)=>v+b[i]),mul=(a,s)=>a.map(v=>v*s),dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),norm=a=>Math.sqrt(dot(a,a)),unit=a=>mul(a,1/norm(a));
const alpha=rad(C.geometry.axis_angle_deg),axis=[Math.sin(alpha),0,Math.cos(alpha)],origin=[0,C.geometry.offset_mm,0];
const scan=C.scan_plan;let a0=scan.azimuth_start_deg,a1=scan.azimuth_end_deg,z0=scan.z_start_mm,z1=scan.z_end_mm;
if(a0===a1){a0-=5;a1+=5}if(z0===z1){z0-=5;z1+=5}const amin=Math.min(a0,a1),amax=Math.max(a0,a1),zmin=Math.min(z0,z1),zmax=Math.max(z0,z1);
let az=a0,z=z0,heading=scan.beam_heading_deg,drag=false,timer=null,playIndex=0,trail=[],samples=[],best=null,dragOffset={x:0,y:0},pendingFrame=null,rayCache=new Map();
function scheduleDraw(){if(pendingFrame===null)pendingFrame=requestAnimationFrame(()=>{pendingFrame=null;draw()})}
const topCanvas=document.getElementById('top');
let gates=[{start:0,end:80,threshold:0.01},{start:0,end:80,threshold:0.01},{start:0,end:80,threshold:0.01}];
const gateIndex=()=>document.getElementById('gate').selectedIndex;
function currentGate(){return gates[gateIndex()]}

function arcContains(a,start,end){return Math.abs(end-start)>=360||(a-start+3600)%360<=(end-start+3600)%360+1e-8}
function validNumber(v){return typeof v==='number'&&Number.isFinite(v)}
function opening(p){const d=add(p,mul(origin,-1)),perp=add(d,mul(axis,-dot(d,axis)));const width=C.geometry.nozzle_OD_mm/2+C.joint.gap_mm+Math.max(C.geometry.main_thickness_mm-C.joint.land_mm,0)*Math.tan(rad(C.joint.bevel_deg));return dot([p[0],p[1],0],axis)>0.05*Math.hypot(p[0],p[1])&&norm(perp)<width}
function point(a,zz,r=R){return [r*Math.cos(rad(a)),r*Math.sin(rad(a)),zz]}
function status(a,zz){if(opening(point(a,zz)))return 'OPENING';let matched=[];
for(const zone of C.scan_zones){let s=zone.assessment||'UNASSESSED';const bounds=['azimuth_start_deg','azimuth_end_deg','z_start_mm','z_end_mm'].map(k=>zone[k]);if(!bounds.every(validNumber)){if(['INACCESSIBLE','INSUFFICIENT_CLEARANCE'].includes(s))return 'BLOCKED';continue}if(arcContains(a,bounds[0],bounds[1])&&zz>=bounds[2]&&zz<=bounds[3])matched.push(s)}
if(matched.some(s=>['INACCESSIBLE','INSUFFICIENT_CLEARANCE'].includes(s)))return 'BLOCKED';return matched.length&&matched.every(s=>s==='FOOTPRINT_FITS_ONLY')?'PLANNED':'UNASSESSED'}
function rayTrace(angleOffset=0){if(rayCache.has(angleOffset))return rayCache.get(angleOffset);const st=status(az,z);if(st==='BLOCKED'||st==='OPENING')return [];
let p=point(az,z),normal=[Math.cos(rad(az)),Math.sin(rad(az)),0],circ=[-normal[1],normal[0],0],tangent=add(mul([0,0,1],Math.cos(rad(heading))),mul(circ,Math.sin(rad(heading))));
let beta=rad(C.mwb.refracted_angle_deg+angleOffset),d=add(mul(normal,-Math.cos(beta)),mul(tangent,Math.sin(beta))),segments=[],total=0;
for(let bounce=0;bounce<5;bounce++){
 let hits=[];for(const radius of [Ri,R]){const A=d[0]**2+d[1]**2,B=2*(p[0]*d[0]+p[1]*d[1]),Q=p[0]**2+p[1]**2-radius**2,disc=B*B-4*A*Q;if(A>1e-12&&disc>=0)for(const t of [(-B-Math.sqrt(disc))/(2*A),(-B+Math.sqrt(disc))/(2*A)])if(t>1e-5)hits.push({t,kind:radius===Ri?'ID':'OD'})}
 if(Math.abs(d[2])>1e-12)for(const zz of [-L/2,L/2]){const t=(zz-p[2])/d[2];if(t>1e-5)hits.push({t,kind:'END'})}
 hits.sort((a,b)=>a.t-b.t);if(!hits.length)break;const h=hits[0],q=add(p,mul(d,h.t));
 // Stop at an encountered preparation opening. This is a conservative envelope, not a weld-solid boundary.
 const cuts=Array.from({length:41},(_,i)=>i/40).find(f=>f>0&&opening(add(p,mul(d,h.t*f))));
 const end=cuts===undefined?q:add(p,mul(d,h.t*cuts)),distance=norm(add(end,mul(p,-1)));total+=distance;
 segments.push({a:p,b:end,length:distance,total,kind:cuts===undefined?h.kind:'OPENING',bounce});
 if(h.kind==='END'||cuts!==undefined)break;
 const n=unit([q[0],q[1],0]);d=add(d,mul(n,-2*dot(d,n)));p=add(q,mul(d,1e-4));
}rayCache.set(angleOffset,segments);return segments}
function positioned(){return C.indications.filter(d=>d.enabled&&['azimuth_deg','z_mm','depth_mm','orientation_deg'].every(k=>validNumber(d[k])))}
function echoes(segments){if(C.workflow!=='TRAINING')return [];const results=[];const speed=C.material.VT_m_s/1000;
for(const flaw of positioned()){const p=point(flaw.azimuth_deg,flaw.z_mm,R-flaw.depth_mm),size=flaw.diameter_mm||Math.max(flaw.length_mm||0,flaw.width_mm||0);let strongest=null,travel=0;
for(const seg of segments){const v=add(seg.b,mul(seg.a,-1)),s=clamp(dot(add(p,mul(seg.a,-1)),v)/dot(v,v),0,1),nearest=add(seg.a,mul(v,s)),miss=norm(add(p,mul(nearest,-1))),dist=travel+s*seg.length;
const width=1+dist*Math.tan(rad(5)),azDiff=rad(heading-flaw.orientation_deg),angular=flaw.diameter_mm?1:0.15+0.85*Math.cos(azDiff)**2;
const amp=0.6*Math.exp(-0.5*(miss/(width+size/2))**2)*angular/(1+dist/250);if(!strongest||amp>strongest.amp)strongest={id:flaw.id,t:2*dist/speed,amp,kind:'flaw'};travel+=seg.length}
if(strongest&&strongest.amp>0.005)results.push(strongest)}
return results}
function canvas(id){const c=document.getElementById(id),g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.fillStyle='#f7fafc';g.fillRect(0,0,c.width,c.height);return g}
const map=(a,zz)=>[45+(a-amin)/(amax-amin)*630,390-(zz-zmin)/(zmax-zmin)*345];
function drawTop(){const g=canvas('top');g.fillStyle='#d5e0e8';g.fillRect(45,45,630,345);
for(let i=0;i<63;i++)for(let j=0;j<35;j++){const a=amin+(i+.5)/63*(amax-amin),zz=zmax-(j+.5)/35*(zmax-zmin),s=status(a,zz);if(s==='BLOCKED'||s==='OPENING'){g.fillStyle=s==='OPENING'?'#b58461':'#efb1b1';g.fillRect(45+i*10,45+j*345/35,10,345/35)}}
g.strokeStyle='#315c8c';g.lineWidth=2;g.beginPath();trail.forEach((p,i)=>{const q=map(p.az,p.z);if(i)g.lineTo(...q);else g.moveTo(...q)});g.stroke();
if(document.getElementById('instructor').checked){for(const d of positioned()){if(d.azimuth_deg<amin||d.azimuth_deg>amax||d.z_mm<zmin||d.z_mm>zmax)continue;const q=map(d.azimuth_deg,d.z_mm);g.fillStyle='#b32269';g.beginPath();g.arc(...q,5,0,Math.PI*2);g.fill();g.fillText(d.id,q[0]+7,q[1])}}
const [x,y]=map(az,z),s=status(az,z);g.save();g.translate(x,y);g.rotate(rad(heading));g.fillStyle=s==='PLANNED'?'#164d83':s==='UNASSESSED'?'#bf8a21':'#bd3343';g.fillRect(-12,-20,24,40);g.strokeStyle='#ffdb25';g.lineWidth=3;g.beginPath();g.moveTo(0,-20);g.lineTo(0,-65);g.stroke();g.restore();
g.fillStyle='#203e55';g.font='13px Arial';g.fillText('Z '+zmax.toFixed(0)+' mm',5,30);g.fillText('Z '+zmin.toFixed(0)+' mm',5,418);g.fillText(amin.toFixed(1)+'°',45,418);g.fillText(amax.toFixed(1)+'°',625,418);g.fillText(T('Surface déroulée — azimut →','Unwrapped surface — azimuth →'),190,25)}
function projection(p){return [p[2],R-Math.hypot(p[0],p[1])]}
let cameraYaw=-0.7,cameraPitch=0.5,cameraZoom=1,cameraDrag=null;
const e1=[Math.cos(alpha),0,-Math.sin(alpha)],e2=[0,1,0];
function nozzlePoint(radius,t,extent){const q=add(origin,add(mul(e1,radius*Math.cos(t)),mul(e2,radius*Math.sin(t))));const A=axis[0]**2+axis[1]**2,B=2*(q[0]*axis[0]+q[1]*axis[1]),D=B*B-4*A*(q[0]**2+q[1]**2-Ri**2);if(D<0)return null;const start=(-B+Math.sqrt(D))/(2*A),end=(R+C.geometry.nozzle_length_mm);return add(q,mul(axis,start+(end-start)*extent))}
function draw3D(segments){const g=canvas('section'),scale=Math.min(600/(L+100),300/(2*R+C.geometry.nozzle_length_mm))*cameraZoom;
 const P=p=>{const x=p[0]*Math.cos(cameraYaw)-p[2]*Math.sin(cameraYaw),zz=p[0]*Math.sin(cameraYaw)+p[2]*Math.cos(cameraYaw),y=p[1]*Math.cos(cameraPitch)-zz*Math.sin(cameraPitch);return [360+x*scale,210-y*scale]};
 const line=(points,color,width=1)=>{g.strokeStyle=color;g.lineWidth=width;g.beginPath();let active=false;for(const p of points){if(!p){active=false;continue}const q=P(p);if(active)g.lineTo(...q);else g.moveTo(...q);active=true}g.stroke()};
 for(const radius of [R,Ri]){
  for(let zz=-L/2;zz<=L/2+1;zz+=L/8)line(Array.from({length:73},(_,i)=>{const p=point(i*5,zz,radius);return opening(p)?null:p}),radius===R?'#7395aa':'#b4c8d2');
  for(let a=0;a<360;a+=30)line(Array.from({length:41},(_,i)=>{const p=point(a,-L/2+i*L/40,radius);return opening(p)?null:p}),'#9ab4c4');
 }
 for(const radius of [C.geometry.nozzle_OD_mm/2,C.geometry.nozzle_OD_mm/2-C.geometry.nozzle_thickness_mm]){
  for(const extent of [0,0.5,1])line(Array.from({length:73},(_,i)=>nozzlePoint(radius,rad(i*5),extent)),'#ac7e50');
  for(let t=0;t<360;t+=30)line([nozzlePoint(radius,rad(t),0),nozzlePoint(radius,rad(t),1)],'#ac7e50');
 }
 for(const off of [-5,0,5])for(const seg of off===0?segments:rayTrace(off))line([seg.a,seg.b],off===0?'#d55b00':'#e4b35f',off===0?3:1);
 const q=P(point(az,z));g.fillStyle=status(az,z)==='PLANNED'?'#175fa2':'#a17325';g.beginPath();g.arc(...q,6,0,Math.PI*2);g.fill();
 if(document.getElementById('instructor').checked)for(const d of positioned()){const q=P(point(d.azimuth_deg,d.z_mm,R-d.depth_mm));g.fillStyle='#ba2473';g.beginPath();g.arc(...q,4,0,Math.PI*2);g.fill();g.fillText(d.id,q[0]+6,q[1])}
 g.fillStyle='#203e55';g.fillText(T('Nozzle 3D — glisser pour tourner, molette pour zoomer','Nozzle 3D — drag to rotate, wheel to zoom'),15,22);
 document.getElementById('raysInfo').textContent=T('Géométrie filaire synchronisée. Les rayons sont tracés dans la paroi principale ; la propagation complète dans le nozzle et la soudure reste à modéliser.','Synchronized wireframe geometry. Rays are traced in the main wall; full nozzle and weld propagation remains to be modeled.');
}
function drawSection(segments){if(document.getElementById('rayView').value==='3d'){draw3D(segments);return}const g=canvas('section'),all=segments.flatMap(s=>[s.a,s.b]);const zs=all.length?all.map(p=>p[2]):[z-30,z+30],lo=Math.min(z-20,...zs),hi=Math.max(z+20,...zs);const P=p=>[50+(p[0]-lo)/(hi-lo)*620,65+p[1]/C.geometry.main_thickness_mm*290];
g.fillStyle='#d5e0e8';g.fillRect(50,65,620,290);g.fillStyle='#203e55';g.font='13px Arial';g.fillText('OD — 0 mm',10,45);g.fillText('ID — '+C.geometry.main_thickness_mm+' mm',10,382);g.fillText('Z '+lo.toFixed(0)+' … '+hi.toFixed(0)+' mm',240,410);
for(const off of [-5,-2.5,0,2.5,5]){const rays=off===0?segments:rayTrace(off);g.strokeStyle=off===0?'#c56a10':'#d8ad65';g.lineWidth=off===0?3:1;for(const s of rays){g.beginPath();g.moveTo(...P(projection(s.a)));g.lineTo(...P(projection(s.b)));g.stroke()}}
if(document.getElementById('instructor').checked){for(const d of positioned()){const q=P([d.z_mm,d.depth_mm]);g.fillStyle='#b32269';g.beginPath();g.arc(...q,4,0,Math.PI*2);g.fill();g.fillText(d.id,q[0]+6,q[1])}}
document.getElementById('raysInfo').textContent=T('Projection Z–profondeur radiale des rayons 3D. Réflexions spéculaires sur les cylindres ID/OD ; arrêt aux extrémités et à l’enveloppe d’ouverture.','Z–radial-depth projection of 3D rays. Specular ID/OD reflections; stops at ends and opening envelope.')+' '+segments.map(s=>s.kind+' '+s.total.toFixed(1)+' mm').join(' | ')}
function drawField(){const g=canvas('field'),P=p=>[360+p[0]/R*125,150-p[1]/R*125];for(const radius of [Ri,R]){g.strokeStyle='#53768a';g.lineWidth=2;g.beginPath();g.arc(360,150,radius/R*125,0,Math.PI*2);g.stroke()}
for(let off=-5;off<=5;off+=1){g.strokeStyle=off===0?'#bc5800':'#d7a351';g.lineWidth=off===0?3:1;for(const seg of rayTrace(off)){g.beginPath();g.moveTo(...P(seg.a));g.lineTo(...P(seg.b));g.stroke()}}
g.fillStyle='#203e55';g.fillText(T('Projection XY — éventail illustratif ±5°, pas de champ d’amplitude','XY projection — illustrative ±5° fan, no amplitude field'),15,20)}
function drawAscan(events){const g=canvas('ascan');g.fillStyle='#071f29';g.fillRect(0,0,720,300);g.strokeStyle='#244450';for(let x=40;x<700;x+=65){g.beginPath();g.moveTo(x,25);g.lineTo(x,260);g.stroke()}const gain=Number(document.getElementById('gain').value),maxTime=Math.max(80,...events.map(e=>e.t*1.2));g.strokeStyle='#60eab3';g.lineWidth=2;g.beginPath();for(let i=0;i<=650;i++){const t=i/650*maxTime,value=events.reduce((s,e)=>s+e.amp*gain*Math.exp(-.5*((t-e.t)/.6)**2),0),y=260-Math.min(1,value)*220;if(i)g.lineTo(40+i,y);else g.moveTo(40+i,y)}g.stroke();g.fillStyle='#c6ece0';g.fillText('0 µs',40,285);g.fillText(maxTime.toFixed(1)+' µs',620,285);
const gate=currentGate(),gated=events.filter(e=>e.t>=gate.start&&e.t<=gate.end&&e.amp>=gate.threshold);
g.strokeStyle='#e0c663';g.lineWidth=1;for(const t of [gate.start,gate.end]){const x=40+t/maxTime*650;if(x>=40&&x<=690){g.beginPath();g.moveTo(x,25);g.lineTo(x,260);g.stroke()}}
const peak=gated.reduce((a,b)=>!a||b.amp>a.amp?b:a,null);if(peak&&(!best||peak.amp>best.amp))best={...peak,az,z,heading};document.getElementById('maxInfo').textContent=C.workflow!=='TRAINING'?T('Examen : aucune acquisition connectée. Aucun signal réel affiché.','Examination: no acquisition connected. No real signal displayed.'):!positioned().length?T('Fixer les positions des cinq indications pour activer la réponse pédagogique. Aucun maximum calculé sans ces données.','Set positions of the five indications to enable training responses. No maximum computed without them.'):T('Réponse heuristique non étalonnée. Maximum mémorisé : ','Uncalibrated heuristic response. Stored maximum: ')+(best?best.amp.toFixed(3)+(document.getElementById('instructor').checked?' · '+best.id:'')+' · θ '+best.heading.toFixed(1)+'°':'—');return peak}
function drawSizing(){const eligible=samples.filter(s=>s.gate===document.getElementById('gate').value&&s.training_peak&&s.training_peak.amp>0);const el=document.getElementById('sizingInfo');if(eligible.length<2){el.textContent=T('Étendue −6 dB : enregistrer plusieurs points autour du maximum dans la même porte.','−6 dB extent: record several points around the maximum in the same gate.');return}const strongest=eligible.reduce((a,b)=>a.training_peak.amp>b.training_peak.amp?a:b),chosen=eligible.filter(s=>s.training_peak.id===strongest.training_peak.id&&s.training_peak.amp>=strongest.training_peak.amp/2);const arc=chosen.map(s=>R*rad(s.azimuth_deg)),zz=chosen.map(s=>s.z_mm);el.textContent=T('Étendue des points à −6 dB : arc ','−6 dB sampled extent: arc ')+(Math.max(...arc)-Math.min(...arc)).toFixed(1)+' mm · Z '+(Math.max(...zz)-Math.min(...zz)).toFixed(1)+' mm · '+chosen.length+T(' points. Étendue du balayage échantillonné, pas taille certifiée du défaut.',' points. Sampled scan extent, not certified flaw size.')}
function draw(){rayCache=new Map();const seg=rayTrace(),events=echoes(seg);drawTop();drawSection(seg);drawField();const peak=drawAscan(events);drawSizing();document.getElementById('state').textContent='Az '+az.toFixed(2)+'° · Z '+z.toFixed(1)+' mm · θ '+heading.toFixed(1)+'° · MWB '+C.mwb.refracted_angle_deg+'° / '+C.mwb.frequency_MHz+' MHz · '+status(az,z)+' · '+T('Points enregistrés : ','Recorded points: ')+samples.length;document.getElementById('truth').textContent=document.getElementById('instructor').checked?C.indications.map(d=>d.id+': '+d.type+' · '+(['azimuth_deg','z_mm','depth_mm','orientation_deg'].every(k=>validNumber(d[k]))?'Az '+d.azimuth_deg+'° / Z '+d.z_mm+' / prof. '+d.depth_mm+' mm':T('Position à fixer','Position pending'))).join(' | '):T('Mode élève : types et positions cachés.','Student mode: types and positions hidden.');return peak}
function stop(){if(timer!==null){clearInterval(timer);timer=null}}
function recordTrail(){trail.push({az,z,heading,status:status(az,z)});if(trail.length>20000)trail.shift()}
function pointer(e){const b=topCanvas.getBoundingClientRect(),x=(e.clientX-b.left)*720/b.width,y=(e.clientY-b.top)*430/b.height;return {x,y}}
function move(e){const p=pointer(e);p.x-=dragOffset.x;p.y-=dragOffset.y;az=clamp(amin+(p.x-45)/630*(amax-amin),amin,amax);z=clamp(zmin+(390-p.y)/345*(zmax-zmin),zmin,zmax);recordTrail();scheduleDraw()}
topCanvas.addEventListener('pointerdown',e=>{const p=pointer(e),q=map(az,z);if(Math.hypot(p.x-q[0],p.y-q[1])>35)return;e.preventDefault();stop();dragOffset={x:p.x-q[0],y:p.y-q[1]};drag=true;topCanvas.setPointerCapture(e.pointerId)});
topCanvas.addEventListener('pointermove',e=>{if(drag)move(e)});for(const name of ['pointerup','pointercancel','lostpointercapture'])topCanvas.addEventListener(name,()=>drag=false);
topCanvas.addEventListener('wheel',e=>{const p=pointer(e),q=map(az,z);if(Math.hypot(p.x-q[0],p.y-q[1])>40)return;e.preventDefault();stop();heading=(heading+(e.deltaY>0?1:-1)+360)%360;scheduleDraw()},{passive:false});
document.getElementById('minus').onclick=()=>{stop();heading=(heading+359)%360;draw()};document.getElementById('plus').onclick=()=>{stop();heading=(heading+1)%360;draw()};document.getElementById('opposite').onclick=()=>{stop();heading=(heading+180)%360;draw()};document.getElementById('pause').onclick=stop;
document.getElementById('demo').onclick=()=>{stop();playIndex=0;trail=[];const points=scan.points;timer=setInterval(()=>{if(playIndex>=points.length){stop();return}const p=points[playIndex++];az=p.azimuth_deg;z=p.z_mm;recordTrail();scheduleDraw()},60)};
document.getElementById('reset').onclick=()=>{stop();az=a0;z=z0;heading=scan.beam_heading_deg;trail=[];samples=[];best=null;draw()};document.getElementById('record').onclick=()=>{const peak=draw();samples.push({azimuth_deg:az,z_mm:z,heading_deg:heading,status:status(az,z),gate:document.getElementById('gate').value,gate_bounds:{...currentGate()},training_peak:peak,ray_segments:rayTrace()});draw()};document.getElementById('gain').oninput=draw;document.getElementById('instructor').onchange=draw;
document.getElementById('download').onclick=()=>{const data={...C,manual_scan:{status:'GEOMETRIC_TRAINING_NOT_VALIDATED',trace:trail,samples,gates,best_training_peak:best}},url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='NOZZLE_MANUAL_SCAN.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
document.getElementById('rayView').onchange=draw;
document.getElementById('cameraReset').onclick=()=>{cameraYaw=-0.7;cameraPitch=0.5;cameraZoom=1;draw()};
const cameraCanvas=document.getElementById('section');
cameraCanvas.addEventListener('pointerdown',e=>{if(document.getElementById('rayView').value!=='3d')return;e.preventDefault();cameraDrag={x:e.clientX,y:e.clientY};cameraCanvas.setPointerCapture(e.pointerId)});
cameraCanvas.addEventListener('pointermove',e=>{if(!cameraDrag)return;cameraYaw+=(e.clientX-cameraDrag.x)*0.006;cameraPitch=clamp(cameraPitch+(e.clientY-cameraDrag.y)*0.006,-1.4,1.4);cameraDrag={x:e.clientX,y:e.clientY};scheduleDraw()});
for(const evt of ['pointerup','pointercancel','lostpointercapture'])cameraCanvas.addEventListener(evt,()=>cameraDrag=null);
cameraCanvas.addEventListener('wheel',e=>{if(document.getElementById('rayView').value!=='3d')return;e.preventDefault();cameraZoom=clamp(cameraZoom*Math.exp(-e.deltaY*0.001),0.4,4);scheduleDraw()},{passive:false});
document.getElementById('gate').onchange=()=>{const g=currentGate();document.getElementById('gateStart').value=g.start;document.getElementById('gateEnd').value=g.end;document.getElementById('gateThreshold').value=g.threshold;best=null;draw()};
for(const id of ['gateStart','gateEnd','gateThreshold'])document.getElementById(id).oninput=()=>{const start=Number(document.getElementById('gateStart').value),end=Number(document.getElementById('gateEnd').value),threshold=Number(document.getElementById('gateThreshold').value);if(Number.isFinite(start)&&Number.isFinite(end)&&Number.isFinite(threshold)&&start>=0&&end>start&&threshold>=0&&threshold<=1){gates[gateIndex()]={start,end,threshold};best=null;draw()}};
document.getElementById('help').textContent=T('1. Glisser la sonde : balayage en créneaux. 2. Sur une réponse, arrêter et tourner légèrement (molette sur sonde ou ±1°). 3. Comparer l’A-scan et enregistrer. Le bouton Créneaux illustre le geste.','1. Drag the probe in a raster. 2. At a response, stop and rotate slightly (wheel over probe or ±1°). 3. Compare the A-scan and record. Raster playback illustrates the motion.');
document.getElementById('notice').textContent=T('Nozzle et cinq indications raccordés aux paramètres de la pièce. UNASSESSED = encombrement non évalué, exploration géométrique uniquement. Rouge/brun = zone bloquée/ouverture, pas de rayon. L’éventail ±5° et les amplitudes pédagogiques ne démontrent pas la couverture. CAD/TCG et cascade : modules non raccordés.','Nozzle and five indications use specimen parameters. UNASSESSED = footprint not assessed, geometric exploration only. Red/brown = blocked zone/opening, no ray. ±5° fan and training amplitudes do not establish coverage. DAC/TCG and cascade: modules not connected.');
for(const [id,text] of [['topTitle',T('Geste opérateur sur le tube principal déroulé','Operator motion on unwrapped main pipe')],['sectionTitle',T('Coupe projetée — rayons dans la paroi cylindrique','Projected section — rays in cylindrical wall')],['ascanTitle',T('A-scan pédagogique — non étalonné','Training A-scan — uncalibrated')],['fieldTitle',T('Faisceau et réflexions — projection XY','Beam and reflections — XY projection')]])document.getElementById(id).textContent=text;
document.getElementById('topHelp').textContent=T('Trace bleue : balayage. Sonde : symbole, dimensions du sabot non représentées. Indications révélées en mode instructeur.','Blue trail: scanning. Probe is a symbol; wedge dimensions are not represented. Instructor mode reveals indications.');recordTrail();draw();
</script></body></html>
