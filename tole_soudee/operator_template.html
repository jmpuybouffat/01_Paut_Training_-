<script id="physics">@@PHYSICS@@</script><script>
const parameters=@@PARAMETERS@@,mesh=@@MESH@@,$=id=>document.getElementById(id),num=id=>Number($(id).value);let lang='FR',records=[],contactEvents=[],running=false,generation=0;
const tr=(fr,en)=>lang==='FR'?fr:en;
const config={geometry:parameters.plate,caps:parameters.caps,material:parameters.material,scan:{margin_mm:1},indications:mesh.indications,reflections:true,inclusion_contrast:.1,amplitude_reference:.05};
const workerCode=document.getElementById('physics').textContent+`
self.onmessage=({data:d})=>{try{const prep=PlatePhysics.prepare(d.c,d.p,d.pr),results=d.angles.map(a=>PlatePhysics.evaluate(prep,a)),selected=PlatePhysics.evaluate(prep,d.pr.angle_deg);if(d.pr.kind!=='PA'){const wall=PlatePhysics.backwall(prep,d.pr.angle_deg);selected.events.push(wall);results[0].events.push(wall);}const ys=Array.from({length:41},(_,i)=>d.p.y-20+i),zs=Array.from({length:11},(_,i)=>i),incident=[],scattered=[],strong=selected.targets.reduce((a,t)=>!a||t.amplitude>a.amplitude?t:a,null);for(const z of zs){const ii=[],ss=[];for(const y of ys){const point=[d.p.x,y,z];ii.push(PlatePhysics.incident(prep,selected,point));ss.push(strong?PlatePhysics.field(prep,selected,point,strong.id).scattered:0);}incident.push(ii);scattered.push(ss);}postMessage({id:d.id,results:results.map(r=>({events:r.events})),selected:{events:selected.events},field:{ys,zs,incident,scattered}});}catch(e){postMessage({id:d.id,error:String(e)})}};`;
let activeWorker=null,pendingResolve=null;
function cancelCompute(){if(activeWorker)activeWorker.terminate();activeWorker=null;if(pendingResolve)pendingResolve(null);pendingResolve=null;}
function compute(d){cancelCompute();return new Promise(resolve=>{pendingResolve=resolve;const url=URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'}));activeWorker=new Worker(url);URL.revokeObjectURL(url);activeWorker.onmessage=e=>{pendingResolve=null;activeWorker.terminate();activeWorker=null;resolve(e.data)};activeWorker.onerror=e=>{pendingResolve=null;resolve({error:e.message});activeWorker.terminate();activeWorker=null};activeWorker.postMessage(d);});}
const layout=title=>({title:{text:title},font:{size:12},margin:{l:55,r:20,b:50,t:45},paper_bgcolor:'#fff'});
function profile(){let kind=$('method').value;return {kind,mode:kind==='SE'?'L':'T',frequency_MHz:kind==='PA'?5:kind==='SE'?4:num('freq'),angle_deg:kind==='SE'?0:kind==='PA'?num('paangle'):num('angle'),body_length_mm:kind==='SE'?8:kind==='PA'?30:24,body_width_mm:kind==='SE'?10:14,exit_offset_mm:kind==='MWB'?8:0,active_width_mm:kind==='SE'?2:8,active_height_mm:kind==='SE'?6:kind==='PA'?12:9,separation_mm:3,cross_depth_mm:5,pitch_mm:num('pitch'),element_width_mm:num('element'),focus_mm:num('focus')};}
function pose(){return {x:num('x'),y:num('y'),heading:num('heading'),face:$('face').value};}
function translate(){document.querySelectorAll('[data-fr]').forEach(e=>e.textContent=e.dataset[lang.toLowerCase()]);renderTable();update(false);}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderTable(){const names=lang==='FR'?['ID','Type','X','Y','Z','Longueur','Largeur','Diamètre','Rx','Ry','Rz']:['ID','Type','X','Y','Z','Length','Width','Diameter','Rx','Ry','Rz'];const keys=['id','type','x_mm','y_mm','z_mm','length_mm','width_mm','diameter_mm','rx_deg','ry_deg','rz_deg'];$('defects').innerHTML='<table><tr>'+names.map(n=>'<th>'+n+'</th>').join('')+'</tr>'+config.indications.map(r=>'<tr>'+keys.map(k=>'<td>'+escapeHtml(k==='type'?({LACK_OF_FUSION:tr('Manque de fusion','Lack of fusion'),SPHERICAL_INCLUSION_REFERENCE:tr('Inclusion sphérique','Spherical inclusion'),SAWTOOTH_CRACK_REFERENCE:tr('Fissure dentelée','Sawtooth crack')}[r[k]]||r[k]):(r[k]??'—'))+'</td>').join('')+'</tr>').join('')+'</table>';}
function drawGeometry(p,pr,b){const traces=mesh.parts.map(part=>({type:'mesh3d',x:part.vertices.map(v=>v[0]),y:part.vertices.map(v=>v[1]),z:part.vertices.map(v=>v[2]),i:part.triangles.map(t=>t[0]),j:part.triangles.map(t=>t[1]),k:part.triangles.map(t=>t[2]),name:lang==='FR'?part.label_fr:part.label_en,color:'rgb('+part.color.slice(0,3).map(x=>Math.round(x*255)).join(',')+')',opacity:.65,hoverinfo:'name'}));
const z=p.face==='TOP'?10:0;const footprint=[...b.corners,b.corners[0]];traces.push({type:'scatter3d',mode:'lines',x:footprint.map(q=>q[0]),y:footprint.map(q=>q[1]),z:footprint.map(()=>z),line:{color:b.ok?'blue':'red',width:5},name:tr('Encombrement du sabot + marge','Wedge footprint + clearance')});traces.push({type:'scatter3d',mode:'markers',x:[p.x],y:[p.y],z:[z+2],marker:{size:6,color:'#155bff'},name:tr('Point d’émergence','Emergence point')});const rays=PlatePhysics.ray(config,p,pr.angle_deg,65);for(const r of rays)traces.push({type:'scatter3d',mode:'lines',x:[r.a[0],r.b[0]],y:[r.a[1],r.b[1]],z:[r.a[2],r.b[2]],line:{width:6,color:'#00b9ca'},name:tr('Axe du faisceau','Beam axis')});
if($('truth').checked)traces.push({type:'scatter3d',mode:'markers',x:config.indications.map(d=>d.x_mm),y:config.indications.map(d=>d.y_mm),z:config.indications.map(d=>d.z_mm),text:config.indications.map(d=>d.id),marker:{size:4,color:'red'},name:tr('Vérité proposée','Proposed truth')});Plotly.react('scene',traces,{...layout(tr('CAO et axe du faisceau — X longitudinal, Y transversal, Z épaisseur','CAD and beam axis — X longitudinal, Y transverse, Z thickness')),scene:{camera:{eye:{x:1.4,y:-1.4,z:1.5}},aspectmode:'data',xaxis:{title:{text:'X mm'}},yaxis:{title:{text:'Y mm'}},zaxis:{title:{text:'Z mm'}}},uirevision:'plate'},{responsive:true});
const corners=[...b.corners,b.corners[0]];Plotly.react('plan',[{x:[0,245,245,0,0],y:[0,0,250,250,0],mode:'lines',name:tr('Tôle','Plate')},{x:[0,245,245,0,0],y:[116,116,134,134,116],fill:'toself',mode:'lines',name:tr('Bourrelets — zone interdite','Caps — excluded area')},{x:corners.map(q=>q[0]),y:corners.map(q=>q[1]),mode:'lines',fill:'toself',name:tr('Sabot + marge','Wedge + clearance')},{x:[p.x],y:[p.y],mode:'markers',name:tr('Émergence','Emergence')}],{...layout(tr('Palpage libre : cliquer dans le plan','Free scanning: click in plan')),dragmode:false,xaxis:{title:{text:'X mm'},range:[0,245]},yaxis:{title:{text:'Y mm'},range:[0,250]}},{responsive:true});}
const times=Array.from({length:401},(_,i)=>i*.1);
async function update(acquire=true){cancelCompute();const token=++generation,p=pose(),pr=profile(),b=PlatePhysics.bounds(config,p,pr);drawGeometry(p,pr,b);contactEvents.push({pose:p,contact:b.ok,reason:b.reason,footprint_mm:b.corners});if(contactEvents.length>2000)contactEvents.shift();if(![p.x,p.y,p.heading,pr.frequency_MHz,pr.pitch_mm,pr.element_width_mm,pr.focus_mm,num('angularstep'),num('gain')].every(Number.isFinite)||pr.frequency_MHz<1||pr.frequency_MHz>10||pr.pitch_mm<.2||pr.pitch_mm>1||pr.element_width_mm<.1||pr.focus_mm<10||pr.angle_deg<0||pr.angle_deg>70||num('angularstep')<1||num('angularstep')>5){$('status').textContent=tr('Paramètres invalides.','Invalid parameters.');return null;}if(!b.ok){for(const id of ['ascan','section','sscan','field'])Plotly.react(id,[],layout(tr('Pas de contact : acquisition suspendue','No contact: acquisition suspended')));$('status').textContent=tr('Hors contact : ','No contact: ')+b.reason;return null;}if(pr.element_width_mm>pr.pitch_mm){$('status').textContent=tr('Largeur élément supérieure au pitch.','Element width exceeds pitch.');return null;}
$('status').textContent=tr('Calcul en cours…','Calculating…');await new Promise(r=>setTimeout(r,20));if(token!==generation)return null;
const angles=pr.kind==='PA'?Array.from({length:Math.floor(35/Math.max(1,num('angularstep')))+1},(_,i)=>35+i*Math.max(1,num('angularstep'))):[pr.angle_deg];if(pr.kind==='PA'&&angles.at(-1)!==70)angles.push(70);const data=await compute({id:token,c:config,p,pr,angles});if(!data||token!==generation)return null;if(data.error){$('status').textContent=data.error;return null;}const {results,selected}=data,gain=10**(num('gain')/20),signal=times.map(t=>gain*PlatePhysics.envelope(selected.events,t,pr.frequency_MHz));
Plotly.react('field',[{type:'heatmap',x:data.field.ys,y:data.field.zs,z:data.field.incident.map(row=>row.map(v=>20*Math.log10(Math.max(v,1e-10)))),colorscale:'Blues',zmin:-80,zmax:0,colorbar:{title:{text:'Incident dB'},x:1}},{type:'contour',x:data.field.ys,y:data.field.zs,z:data.field.scattered.map(row=>row.map(v=>20*Math.log10(Math.max(v,1e-10)))),autocontour:false,contours:{coloring:'lines',start:-120,end:0,size:10},line:{width:2},colorscale:'Hot',showscale:false}],{...layout(tr('Champ incident + diffusion du réflecteur dominant (scalaire)','Incident field + dominant reflector scattering (scalar)')),xaxis:{title:{text:'Y mm'}},yaxis:{title:{text:'Z mm'},range:[10,0]}},{responsive:true});

Plotly.react('ascan',[{x:times,y:signal,mode:'lines',line:{color:'#0d75a6'}}],{...layout('A-scan · '+pr.kind+' · '+pr.angle_deg+'° · '+tr('enveloppe','envelope')),xaxis:{title:{text:'µs'}},yaxis:{title:{text:tr('Amplitude relative × gain','Relative amplitude × gain')},range:[0,1]}},{responsive:true});
const ray=PlatePhysics.ray(config,p,pr.angle_deg,65),sectionTraces=ray.map(r=>({x:[r.a[1],r.b[1]],y:[r.a[2],r.b[2]],mode:'lines',name:tr('Axe géométrique','Geometric axis')}));if($('truth').checked)sectionTraces.push({x:config.indications.filter(d=>Math.abs(d.x_mm-p.x)<3).map(d=>d.y_mm),y:config.indications.filter(d=>Math.abs(d.x_mm-p.x)<3).map(d=>d.z_mm),mode:'markers',name:tr('Vérité, coupe X ±3 mm','Truth, X section ±3 mm')});Plotly.react('section',sectionTraces,{...layout(tr('Coupe Y–Z (axe, pas champ acoustique)','Y–Z section (axis, not acoustic field)')),xaxis:{title:{text:'Y mm'},range:[75,175]},yaxis:{title:{text:'Z mm'},range:[-3,13]}},{responsive:true});
const points=[];results.forEach((e,i)=>times.forEach(t=>{const v=gain*PlatePhysics.envelope(e.events,t,pr.frequency_MHz);if(v>.00001){const q=PlatePhysics.project(config,p,angles[i],t,pr);points.push({q,v,t,angle:angles[i]});}}));Plotly.react('sscan',[{x:points.map(d=>d.q[1]),y:points.map(d=>d.q[2]),mode:'markers',marker:{size:5,color:points.map(d=>20*Math.log10(Math.max(d.v,1e-8))),colorscale:'Turbo',cmin:-60,cmax:0,colorbar:{title:{text:'dB'}}},type:'scatter'}],{...layout(pr.kind==='PA'?tr('S-scan Y–Z · rétroprojection','Y–Z S-scan · backprojection'):tr('Trace Y–Z monoélément','Single-element Y–Z trace')),xaxis:{title:{text:'Y mm'}},yaxis:{title:{text:'Z mm'},range:[10,0]}},{responsive:true});
if(acquire){records.push({input_source:$('inputSource').value,pose:p,pose6d:{position_mm:[p.x,p.y,p.face==='TOP'?10:0],euler_xyz_deg:[p.face==='TOP'?0:180,0,p.heading],rotation_convention:'Rz_Ry_Rx',origin:'EMERGENCE_ON_STEEL'},contact:{valid:true,footprint_mm:b.corners},profile:pr,angles,events:results.map(r=>r.events)});if(records.length>1000)records.shift();window.dispatchEvent(new CustomEvent('byte-ndt-plate-response',{detail:cleanRecord(records.at(-1))}));}drawAcquisition();$('status').textContent=tr('Contact valide · ','Valid contact · ')+records.length+tr(' positions enregistrées. Calcul scalaire réduit ; amplitude non étalonnée.',' recorded poses. Reduced scalar calculation; uncalibrated amplitude.');if(Math.max(...signal)>1)$('status').textContent+=tr(' Échelle dépassée : réduire le gain pour voir le maximum.',' Off-scale: reduce gain to see the peak.');return {p,pr};}
function drawAcquisition(){const xx=[],tt=[],vv=[],cloud=[];for(const [recordIndex,r] of records.entries()){const events=r.events[0]||[];for(const t of times){const v=PlatePhysics.envelope(events,t,r.profile.frequency_MHz);if(v>1e-8){xx.push(recordIndex+1);tt.push(t);vv.push(20*Math.log10(v)+num('gain'));}}for(let i=0;i<r.angles.length;i++)for(const e of r.events[i])if(e.amplitude>1e-7)cloud.push({q:PlatePhysics.project(config,r.pose,r.angles[i],e.time_us,r.profile),v:20*Math.log10(e.amplitude)+num('gain')});}Plotly.react('bscan',[{x:xx,y:tt,mode:'markers',marker:{size:4,color:vv,colorscale:'Turbo',cmin:-60,cmax:0}}],{...layout(tr('B-scan · premier rayon · séquence de palpage','B-scan · first ray · scan sequence')),xaxis:{title:{text:tr('Position enregistrée n°','Recorded pose #')}},yaxis:{title:{text:'µs'},autorange:'reversed'}},{responsive:true});Plotly.react('map',[{type:'scatter3d',x:cloud.map(d=>d.q[0]),y:cloud.map(d=>d.q[1]),z:cloud.map(d=>d.q[2]),mode:'markers',marker:{size:3,color:cloud.map(d=>d.v),colorscale:'Turbo',cmin:-60,cmax:0}}],{...layout(tr('Cumul 3D des réponses rétroprojetées','Accumulated 3D backprojected responses')),scene:{xaxis:{title:{text:'X mm'}},yaxis:{title:{text:'Y mm'}},zaxis:{title:{text:'Z mm'}}},uirevision:'map'},{responsive:true});}
$('fr').onclick=()=>{lang='FR';translate()};$('en').onclick=()=>{lang='EN';translate()};$('calculate').onclick=()=>update();$('reverse').onclick=()=>{$('heading').value=(num('heading')+180)%360;update()};$('step').onclick=()=>{$('x').value=num('x')+2;update()};$('preset').onclick=()=>{const k=$('method').value;$('x').value=k==='SE'?105:65;$('y').value=k==='SE'?111:k==='PA'?100:105.125;$('heading').value=90;$('angle').value=45;$('face').value='TOP';$('xmin').value=k==='SE'?95:50;$('xmax').value=k==='SE'?115:80;$('ymin').value=k==='SE'?110:k==='PA'?95:100;$('ymax').value=k==='SE'?111:k==='PA'?100:105;update();};$('truth').onchange=()=>update(false);$('method').onchange=()=>$('preset').click();$('stop').onclick=()=>{running=false;generation++;cancelCompute();$('status').textContent=tr('Arrêt demandé.','Stop requested.');};$('reset').onclick=()=>{running=false;generation++;cancelCompute();records=[];contactEvents=[];drawAcquisition()};$('raster').onclick=async()=>{if(running)return;const a=num('xmin'),b=num('xmax'),c=num('ymin'),d=num('ymax'),dy=num('ystep');if(![a,b,c,d,dy].every(Number.isFinite)||a>b||c>d||dy<1||((b-a)/2+1)*((d-c)/dy+1)>1000){$('status').textContent=tr('Parcours invalide ou supérieur à 1 000 positions.','Invalid path or more than 1,000 poses.');return;}running=true;let row=0;for(let y=c;y<=d&&running;y+=dy,row++){const xs=[];for(let x=a;x<=b;x+=2)xs.push(x);if(row%2)xs.reverse();for(const x of xs){if(!running)break;$('x').value=x;$('y').value=y;const ok=await update();if(!ok){running=false;break;}await new Promise(r=>setTimeout(r,30));}}running=false;};
$('export').onclick=()=>{const data={schema:'BYTE_NDT_PLATE_TRAINING_P01',language:lang,units:{length:'mm',time:'us',angle:'deg'},material:config.material,parameters,pa_candidate_manufacturer:$('maker').value,manufacturer_reference:null,model:'REDUCED_SCALAR_NOT_VALIDATED',truth:$('purpose').value==='TRAINING'?config.indications:null,acquisition:records.map(cleanRecord),contact_events:contactEvents,report:{operator:$('operator').value,procedure:$('standard').value,text:$('report').value},vr:{frame:mesh.coordinate_system,units:'mm',millimetres_to_metres:.001,pose_definition:'Emergence point on steel, heading about +Z, TOP/BOTTOM; wedge geometry provisional',cad_mesh_file:'CAO/geometrie_pour_rv.json',pose6d_note:'Contact locks roll/pitch; camera adapter supplied by Fabien; no headset required',input_api:'window.ByteNDTPlate.applyTrackedPose',response_event:'byte-ndt-plate-response',camera_calibration:'External: poses must already be in plate frame'}};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='BYTE_NDT_PLATE_P01.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
let lastCameraSequence=-1;
function trackingFailure(reason){cancelCompute();generation++;for(const id of ['ascan','section','sscan','field'])Plotly.react(id,[],layout(tr('Suivi non valide','Invalid tracking')));$('status').textContent=tr('Suivi caméra refusé : ','Camera tracking rejected: ')+reason;contactEvents.push({source:'CAMERA',contact:false,reason});return {accepted:false,reason};}
async function applyTrackedPose(d){if($('inputSource').value!=='CAMERA')return trackingFailure('CAMERA_INPUT_DISABLED');if(running)return trackingFailure('RASTER_RUNNING');if(!Number.isInteger(d.sequence)||d.sequence<=lastCameraSequence)return trackingFailure('STALE_SEQUENCE');if(!Number.isFinite(d.timestamp_ms)||!Number.isFinite(d.confidence)||d.confidence<.7||d.confidence>1)return trackingFailure('LOW_CONFIDENCE_OR_INVALID_TIMESTAMP');if(!Array.isArray(d.position_mm)||d.position_mm.length!==3||!d.position_mm.every(Number.isFinite)||!Array.isArray(d.euler_xyz_deg)||d.euler_xyz_deg.length!==3||!d.euler_xyz_deg.every(Number.isFinite)||!['TOP','BOTTOM'].includes(d.face))return trackingFailure('INVALID_POSE');lastCameraSequence=d.sequence;const top=d.face==='TOP',wrap=x=>((x+180)%360+360)%360-180;if(Math.abs(wrap(d.euler_xyz_deg[0]-(top?0:180)))>3||Math.abs(wrap(d.euler_xyz_deg[1]))>3||Math.abs(d.position_mm[2]-(top?10:0))>.5)return trackingFailure('LIFT_OR_TILT');$('x').value=d.position_mm[0];$('y').value=d.position_mm[1];$('heading').value=d.euler_xyz_deg[2];$('face').value=d.face;const result=await update();return {accepted:!!result,reason:result?'CONTACT':'NO_CONTACT'};}
window.ByteNDTPlate={version:'P01',applyTrackedPose};
$('applyTracked').onclick=async()=>{try{await applyTrackedPose(JSON.parse($('trackedPose').value));}catch(e){trackingFailure('INVALID_JSON');}};
$('inputSource').onchange=()=>{running=false;generation++;cancelCompute();lastCameraSequence=-1;for(const id of ['x','y','heading','face','calculate','reverse','step','raster'])$(id).disabled=$('inputSource').value==='CAMERA';};

function cleanRecord(r){return {...r,events:r.events.map(list=>list.map(e=>{const q={...e};delete q.position_from_truth_not_reconstruction;if($('purpose').value==='EXAM'){delete q.id;delete q.model;delete q.path;q.kind='echo';}return q;}))};}
function downloadJson(name,data){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('purpose').onchange=()=>{running=false;records=[];const exam=$('purpose').value==='EXAM';$('truth').checked=!exam;$('truth').disabled=exam;$('truthDetails').hidden=exam;$('scenario').hidden=exam;$('preset').disabled=exam;update(false)};

$('scenarioExport').onclick=()=>downloadJson('INDICATIONS_ML.json',config.indications);
$('scenarioFile').onchange=async()=>{try{const rows=JSON.parse(await $('scenarioFile').files[0].text());if(!Array.isArray(rows)||rows.length>20)throw Error('1–20 indications');for(const r of rows){if(!['LACK_OF_FUSION','SPHERICAL_INCLUSION_REFERENCE','SAWTOOTH_CRACK_REFERENCE'].includes(r.type))throw Error('type');for(const k of ['x_mm','y_mm','z_mm','rx_deg','ry_deg','rz_deg'])if(!Number.isFinite(r[k]))throw Error(k);if(r.x_mm<0||r.x_mm>245||r.y_mm<0||r.y_mm>250||r.z_mm<0||r.z_mm>10)throw Error('XYZ');if(r.type==='SPHERICAL_INCLUSION_REFERENCE'){if(!(r.diameter_mm>0&&r.diameter_mm<=3))throw Error('diameter');}else if(!(r.length_mm>0&&r.length_mm<=10&&r.width_mm>=.1&&r.width_mm<=3))throw Error('dimensions');r.enabled=r.enabled!==false;}config.indications=rows;records=[];renderTable();update(false);}catch(e){$('status').textContent=tr('Scénario invalide : ','Invalid scenario: ')+e.message;}};

translate();$('plan').addEventListener('pointerup',e=>{if(running||$('inputSource').value==='CAMERA'||e.target.closest('.modebar'))return;const plot=$('plan'),l=plot._fullLayout,rect=plot.getBoundingClientRect(),xp=e.clientX-rect.left-l.xaxis._offset,yp=e.clientY-rect.top-l.yaxis._offset;if(xp<0||yp<0||xp>l.xaxis._length||yp>l.yaxis._length)return;$('x').value=l.xaxis.p2d(xp).toFixed(2);$('y').value=l.yaxis.p2d(yp).toFixed(2);update();});
